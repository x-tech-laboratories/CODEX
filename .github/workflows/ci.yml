name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The build and the tests need neither the Electron binary nor node-llama-cpp's prebuilt binaries.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run lint
  # Refreshes a stale Nix npm deps hash on a pull request, and fails on one elsewhere.
  npm-deps-hash:
    uses: x-tech-laboratories/X-Libs/.github/workflows/npm-deps-hash.yml@main
    permissions:
      contents: write
      actions: write
